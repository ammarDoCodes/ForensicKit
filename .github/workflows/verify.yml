name: Verify ForensicKit

on:
  push:
  pull_request:

jobs:
  offline-core:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run standard-library tests
        run: python tests/run_tests.py
      - name: Check Python and JavaScript syntax
        shell: pwsh
        run: |
          python -m compileall -q forensickit tests benchmarks
          node --check forensickit/ui/app.js
      - name: Analyze synthetic sample
        shell: pwsh
        run: |
          python -m forensickit analyze verification-case --input examples/sample-case/evidence
          python -m forensickit summary verification-case
