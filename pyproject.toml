[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensickit"
version = "1.2.3"
description = "Offline, provenance-preserving forensic evidence reconstruction"
requires-python = ">=3.11"

[project.scripts]
forensickit = "forensickit.cli:main"

[project.optional-dependencies]
evtx = ["python-evtx==0.8.1"]

[tool.setuptools.package-data]
forensickit = ["ui/*.html", "ui/*.js", "ui/*.css", "ui/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
